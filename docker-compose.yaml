# docker-compose.yml
services:
  app:
    build:
      dockerfile: ./backend/Dockerfile
    depends_on:
      - db
    ports:
      - "8089:8080"
    environment:
      DB_LOCAL: db
      DB_USER: user1
      DB_PASSWORD: password1
      DB_NAME: database1
 
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: database1
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
    ports:
      - "5439:5432"