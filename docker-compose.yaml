name: fda-monitor
services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src/
      - ./backend/data:/app/src/data/
      - ${LOCAL_GCP_SERVICE_ACCOUNT_KEY}:/${GCP_SERVICE_ACCOUNT_KEY}
    environment:
      DB_HOST: db
      # DB_USER: ${DB_USER}
      # DB_PASSWORD: ${DB_PASSWORD}
      # DB_NAME: ${DB_NAME}
      DB_PORT: 5432
    env_file:
      - ./.env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.runOnSave=true"]
    depends_on:
      - server
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/
    environment:
      API_BASE_URL: http://server:8080
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  postgres_data:
