services:
  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:8080"
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-fda_data}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-******}
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fda_data}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
