repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.8
    hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [python]
      args: ["--ignore", "BLE001,E722,F401,DTZ", --fix]
    # Run the formatter.
    - id: ruff-format
      types_or: [python]
